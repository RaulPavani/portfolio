<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>Portfolio</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #000; }
      #carregando { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
                    color: #ccc; font-family: sans-serif; font-size: 18px; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="carregando">Carregando…</div>
    <script>
      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "RaulPavani",
        productName: "Portfolio",
        productVersion: "1.0",
      };
      var carregando = document.querySelector("#carregando");
      var script = document.createElement("script");
      script.src = buildUrl + "/WebGL.loader.js";
      script.onload = function () {
        createUnityInstance(document.querySelector("#unity-canvas"), config, function (progresso) {
          carregando.textContent = "Carregando… " + Math.round(progresso * 100) + "%";
        }).then(function () {
          carregando.remove();
        }).catch(function (mensagem) {
          carregando.textContent = mensagem;
        });
      };
      // Sem isto, um loader 404 (index.html de outra build) deixa "Carregando…" para sempre.
      script.onerror = function () {
        carregando.textContent = "Não achei " + script.src + ". O index.html é de outra build?";
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
